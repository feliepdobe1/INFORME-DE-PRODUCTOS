name: Informe diario de productos ganadores

on:
  schedule:
    # 13:00 UTC = 8:00 AM hora de Colombia (UTC-5), todos los días
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # te deja correrlo manualmente desde GitHub cuando quieras probarlo

permissions:
  contents: write

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar y enviar informe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python informe_diario.py

      - name: Guardar el informe en el repo (historial)
        run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add informes/
          git commit -m "Informe diario $(date +'%Y-%m-%d')" || echo "Sin cambios para commitear"
          git push
